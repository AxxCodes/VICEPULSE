name: Deploy VICEPULSE to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/configure-pages@v5
        id: pages
      - name: Build public site
        run: node scripts/build-site.mjs --local dist
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - uses: actions/deploy-pages@v5
        id: deploy
        continue-on-error: true
      - name: Wait for the Pages artifact to become available
        if: steps.deploy.outcome == 'failure'
        run: sleep 30
      - uses: actions/deploy-pages@v5
        id: retry
        if: steps.deploy.outcome == 'failure'
